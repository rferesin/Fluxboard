name: Deploy Fluxboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --base-href /Fluxboard/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare SPA fallback
        run: |
          BUILD_DIR=$(find dist -type f -name index.html -printf '%h\n' | head -n 1)
          test -n "$BUILD_DIR"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
